name: Deploy

# Manual or release-tag triggered deploy.
# Uploads source code to server and rebuilds containers in place.

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  ssh-deploy:
    name: SSH · upload & rebuild
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Upload backend source
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          source: "backend/"
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 0

      - name: Upload frontend source
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          source: "frontend/"
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 0

      - name: Rebuild & restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose -f docker-compose.prod.yml --env-file .env.prod build api worker web
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans
            docker compose -f docker-compose.prod.yml ps

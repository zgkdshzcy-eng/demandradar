services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: demandradar-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-demandradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demandradar}
      POSTGRES_DB: ${POSTGRES_DB:-demandradar}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-demandradar}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: demandradar-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:

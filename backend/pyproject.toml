[project]
name = "demandradar-backend"
version = "0.1.0"
description = "DemandRadar backend: collectors + LLM analyzer + report engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.13.3",
    "psycopg[binary]>=3.2.3",
    "redis>=5.2.0",
    "httpx>=0.27.2",
    "tenacity>=9.0.0",
    "apscheduler>=3.10.4",
    "celery>=5.4.0",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.2",
    "feedparser>=6.0.11",
    "praw>=7.8.1",
    "pytrends>=4.9.2",
    "pgvector>=0.3.6",
    "numpy>=2.1.3",
    "scikit-learn>=1.5.2",
    "anthropic>=0.39.0",
    "openai>=1.54.0",
    "jinja2>=3.1.4",
    "pyyaml>=6.0.2",
    "typer>=0.13.0",
    "markdown>=3.7",
    "sentry-sdk[fastapi]>=2.18.0",
    "prometheus-client>=0.21.0",
    "stripe>=11.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.2",
    "mypy>=1.13.0",
]
# Optional PDF rendering. Skipped on Windows by default (weasyprint requires GTK).
# Install on Linux/Mac via: pip install -e ".[pdf]"
pdf = [
    "weasyprint>=63.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

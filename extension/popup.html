<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>DemandRadar Scout</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      background: #0f172a;
      color: #e2e8f0;
    }
    h1 { font-size: 16px; color: #10b981; margin-bottom: 4px; }
    p { color: #94a3b8; font-size: 12px; margin-bottom: 12px; }
    .btn {
      display: block;
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      margin-bottom: 8px;
      text-decoration: none;
    }
    .btn-primary { background: #10b981; color: #fff; }
    .btn-primary:hover { background: #059669; }
    .btn-outline { background: transparent; border: 1px solid #334155; color: #e2e8f0; }
    .btn-outline:hover { border-color: #64748b; }
    .status { font-size: 11px; color: #64748b; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>
  <h1>DemandRadar Scout</h1>
  <p>Real-time demand insights while you browse tech communities.</p>
  <a href="https://demandradar.app" target="_blank" class="btn btn-primary">Open DemandRadar</a>
  <a href="https://demandradar.app/radar" target="_blank" class="btn btn-outline">View Radar</a>
  <a href="https://demandradar.app/briefs" target="_blank" class="btn btn-outline">Browse Briefs</a>
  <div class="status">Sidebar auto-injects on HN, PH, V2EX, Lobsters, IH</div>
</body>
</html>
